<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" role="img" aria-label="FreeBooks ERP">
  <defs>
    <linearGradient id="lgLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2191c0"/>
      <stop offset="100%" stop-color="#004e72"/>
    </linearGradient>
    <linearGradient id="lgRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0078ae"/>
      <stop offset="100%" stop-color="#005f8a"/>
    </linearGradient>
  </defs>

  <!-- Left page — bows outward top and bottom like an open book -->
  <path d="M4,8 Q24,4 44,8 L44,62 Q24,67 4,62 Z" fill="url(#lgLeft)"/>

  <!-- Right page -->
  <path d="M48,8 Q68,4 88,8 L88,62 Q68,67 48,62 Z" fill="url(#lgRight)"/>

  <!-- Spine (dark channel between pages) -->
  <rect x="43" y="4" width="6" height="65" fill="#003d60" rx="1"/>

  <!-- Ledger lines – left page (brighter = front) -->
  <line x1="9"  y1="22" x2="40" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.70"/>
  <line x1="9"  y1="32" x2="40" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.70"/>
  <line x1="9"  y1="42" x2="40" y2="42" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.70"/>
  <line x1="9"  y1="52" x2="40" y2="52" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.70"/>

  <!-- Ledger lines – right page (dimmer = depth) -->
  <line x1="52" y1="22" x2="83" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <line x1="52" y1="32" x2="83" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <line x1="52" y1="42" x2="83" y2="42" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <line x1="52" y1="52" x2="83" y2="52" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>

  <!-- "FreeBooks" wordmark -->
  <text x="104" y="44"
        font-family="Verdana,Arial,sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#0078ae">FreeBooks</text>

  <!-- "ERP" tagline -->
  <text x="107" y="61"
        font-family="Verdana,Arial,sans-serif"
        font-size="11"
        fill="#2191c0"
        letter-spacing="5">ERP</text>
</svg>
