# Builds the FreeBooks container image and publishes it to GitHub Container Registry.
#
#   tag vX.Y.Z   -> ghcr.io/<owner>/freebooks:X.Y.Z, X.Y and latest
#   push master  -> ghcr.io/<owner>/freebooks:edge
#
# A release tag must match MODULE_PHREEDOM_VERSION, the version the application
# reports about itself.
name: Container image

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(sed -n "s/.*define('MODULE_PHREEDOM_VERSION', *'\([^']*\)').*/\1/p" trunk/modules/phreedom/config.php)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, application $app"
          test "$tag" = "$app"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/freebooks
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FREEBOOKS_VERSION=${{ steps.meta.outputs.version }}
            FREEBOOKS_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
